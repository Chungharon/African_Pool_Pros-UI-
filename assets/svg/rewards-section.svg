<?xml version="1.0" encoding="UTF-8"?>
<svg width="448" height="80" viewBox="0 0 448 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rewards Section Component -->
  
  <!-- Left Column (WIN) -->
  <rect x="0" y="0" width="224" height="80" fill="none" stroke="#F2B705" stroke-width="1" stroke-opacity="0.3"/>
  <text x="16" y="20" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" fill="white">WIN</text>
  
  <!-- Coins Stack -->
  <circle cx="32" cy="48" r="10" fill="#F2B705"/>
  <circle cx="24" cy="56" r="10" fill="#F2B705"/>
  <circle cx="40" cy="56" r="10" fill="#F2B705"/>
  
  <!-- Amount -->
  <text x="140" y="58" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">3000</text>
  
  <!-- Center Divider -->
  <line x1="224" y1="10" x2="224" y2="70" stroke="#F2B705" stroke-width="1" opacity="0.5"/>
  
  <!-- Right Column (ENTRY) -->
  <rect x="224" y="0" width="224" height="80" fill="none" stroke="#F2B705" stroke-width="1" stroke-opacity="0.3"/>
  <text x="240" y="20" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" fill="white">ENTRY</text>
  
  <!-- Coin with Dollar -->
  <circle cx="264" cy="50" r="12" fill="#F2B705" opacity="0.3"/>
  <text x="264" y="58" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#F2B705" text-anchor="middle">$</text>
  
  <!-- Amount -->
  <text x="364" y="58" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">1500</text>
</svg>
