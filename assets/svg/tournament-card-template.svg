<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="640" viewBox="0 0 480 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tournament Card Template - Main Component -->
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imageOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect x="8" y="8" width="464" height="624" rx="24" fill="url(#cardGradient)" stroke="#F2B705" stroke-width="3" filter="url(#glow)"/>
  
  <!-- === HEADER SECTION (56px) === -->
  <g id="header">
    <!-- Level Indicator (Left) -->
    <circle cx="48" cy="40" r="24" fill="#0a0e27" stroke="#F2B705" stroke-width="2"/>
    <text x="48" y="47" font-family="Montserrat, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">10</text>
    
    <!-- Titles (Center) -->
    <text x="240" y="32" font-family="Montserrat, sans-serif" font-size="44" font-weight="700" fill="white" text-anchor="middle">LAGOS</text>
    <text x="240" y="52" font-family="Montserrat, sans-serif" font-size="20" font-weight="600" fill="#F2B705" text-anchor="middle">NIGERIA</text>
    
    <!-- Country Flag (Right) -->
    <circle cx="432" cy="40" r="24" fill="none" stroke="#F2B705" stroke-width="2"/>
    <rect x="408" y="16" width="48" height="48" rx="24" fill="#009651"/>
    <rect x="408" y="16" width="16" height="48" fill="white"/>
    <rect x="424" y="16" width="16" height="48" fill="#FFF500"/>
  </g>
  
  <!-- === BACKGROUND IMAGE AREA (280px) === -->
  <rect x="16" y="72" width="448" height="252" rx="16" fill="#1a1f3a"/>
  <rect x="16" y="72" width="448" height="252" rx="16" fill="url(#imageOverlay)"/>
  <text x="240" y="190" font-family="Arial, sans-serif" font-size="12" fill="#999999" text-anchor="middle" opacity="0.6">[Background Image Placeholder]</text>
  <text x="240" y="208" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle" opacity="0.4">448x252px (Replace with city/landmark image)</text>
  
  <!-- === GAME BADGE SECTION (60px) === -->
  <g id="game-badge">
    <!-- Badge Background with Hexagon Style -->
    <rect x="80" y="340" width="320" height="56" rx="12" fill="#0a0e27" stroke="#F2B705" stroke-width="2"/>
    <polygon points="80,340 100,340 320,340 340,368 320,396 100,396 80,368" fill="none" stroke="#F2B705" stroke-width="2" opacity="0"/>
    
    <!-- Badge Icon Placeholder -->
    <circle cx="110" cy="368" r="16" fill="#F2B705" opacity="0.2"/>
    <text x="110" y="372" font-family="Arial, sans-serif" font-size="18" fill="#F2B705" text-anchor="middle">8</text>
    
    <!-- Badge Text -->
    <text x="240" y="368" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" fill="#F2B705" text-anchor="middle">8 BALL CALL POCKET</text>
  </g>
  
  <!-- === REWARDS SECTION (80px) === -->
  <g id="rewards">
    <!-- Left Column (WIN) -->
    <rect x="16" y="416" width="224" height="80" fill="none" stroke="#F2B705" stroke-width="1" stroke-opacity="0.3"/>
    <text x="32" y="431" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" fill="white">WIN</text>
    <circle cx="48" cy="456" r="10" fill="#F2B705"/>
    <circle cx="40" cy="464" r="10" fill="#F2B705"/>
    <circle cx="56" cy="464" r="10" fill="#F2B705"/>
    <text x="140" y="468" font-family="Montserrat, sans-serif" font-size="36" font-weight="800" fill="white">3000</text>
    
    <!-- Center Divider -->
    <line x1="240" y1="426" x2="240" y2="486" stroke="#F2B705" stroke-width="1" opacity="0.5"/>
    
    <!-- Right Column (ENTRY) -->
    <rect x="240" y="416" width="224" height="80" fill="none" stroke="#F2B705" stroke-width="1" stroke-opacity="0.3"/>
    <text x="256" y="431" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" fill="white">ENTRY</text>
    <circle cx="280" cy="460" r="12" fill="#F2B705" opacity="0.3"/>
    <text x="300" y="466" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#F2B705">$</text>
    <text x="364" y="468" font-family="Montserrat, sans-serif" font-size="36" font-weight="800" fill="white">1500</text>
  </g>
  
  <!-- === RATING STARS SECTION (40px) === -->
  <g id="stars">
    <text x="150" y="530" font-family="Arial, sans-serif" font-size="24" fill="#F2B705">★</text>
    <text x="190" y="530" font-family="Arial, sans-serif" font-size="24" fill="#F2B705">★</text>
    <text x="230" y="530" font-family="Arial, sans-serif" font-size="24" fill="#F2B705">★</text>
    <text x="270" y="530" font-family="Arial, sans-serif" font-size="24" fill="#F2B705">★</text>
    <text x="310" y="530" font-family="Arial, sans-serif" font-size="24" fill="#F2B705">★</text>
  </g>
  
  <!-- === DIFFICULTY BADGE SECTION (40px) === -->
  <g id="difficulty-badge">
    <rect x="100" y="550" width="280" height="40" rx="10" fill="#0a0e27" stroke="#00AA44" stroke-width="2"/>
    <text x="240" y="572" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">MASTER LEVEL</text>
  </g>
  
  <!-- === FOOTER SECTION (32px) === -->
  <g id="footer">
    <text x="24" y="610" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="white">👥</text>
    <text x="48" y="610" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="white">186</text>
    <text x="78" y="610" font-family="Montserrat, sans-serif" font-size="12" font-weight="600" fill="#F2B705">Playing</text>
  </g>
</svg>
