<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="56" viewBox="0 0 320 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Game Badge Component -->
  <defs>
    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="320" height="56" rx="12" fill="#0a0e27" stroke="#F2B705" stroke-width="2" filter="url(#badgeGlow)"/>
  
  <!-- Icon -->
  <circle cx="30" cy="28" r="16" fill="#F2B705" opacity="0.3"/>
  <text x="30" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#F2B705" text-anchor="middle">8</text>
  
  <!-- Text -->
  <text x="160" y="33" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" fill="#F2B705" text-anchor="middle">8 BALL CALL POCKET</text>
</svg>
